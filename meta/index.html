<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meta Analysis</title>

  <link rel="stylesheet" href="../styles.css" />
  <script type="module" src="../global.js"></script>
  <script type="module" src="main.js"></script>
</head>

<body>
  <h1>Meta Analysis</h1>

  <p>
    This page analyzes the code in my portfolio website using D3.
    It summarizes lines of code, commits, file types, and coding patterns over time.
  </p>

  <section>
    <h2>Summary Stats</h2>

    <div class="commit-filter">
      <label for="commit-progress">
        Show commits until:
        <input id="commit-progress" type="range" min="0" max="100" value="100" />
        <time id="commit-time"></time>
      </label>
    </div>

    <div id="stats"></div>
  </section>

  <div id="scrolly-1">
    <div id="scatter-story"></div>

    <div id="scatter-plot">
      <section>
        <h2>Commits by Time of Day</h2>
        <div id="chart"></div>
      </section>

      <section>
        <h2>Selection Details</h2>
        <p id="selection-count">No commits selected</p>
        <dl id="language-breakdown" class="stats"></dl>
      </section>
    </div>
  </div>

  <dl id="files"></dl>

  <dl id="commit-tooltip" class="info tooltip" hidden>
    <dt>Commit</dt>
    <dd>
      <a href="" id="commit-link" target="_blank"></a>
    </dd>

    <dt>Date</dt>
    <dd id="commit-date"></dd>

    <dt>Time</dt>
    <dd id="tooltip-commit-time"></dd>

    <dt>Author</dt>
    <dd id="commit-author"></dd>

    <dt>Lines edited</dt>
    <dd id="commit-lines"></dd>
  </dl>
</body>
</html>
